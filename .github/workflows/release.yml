# Builds the Windows installer and publishes it as a GitHub Release whenever a
# version tag (v1.2.3) is pushed. The release carries latest.yml, which is how
# installed copies of LUMA find and download the update.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run typecheck

      - name: Check the tag matches package.json
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} but package.json says $v"; exit 1; }

      # One release made up front: when electron-builder creates it itself, its
      # parallel uploads can each make their own release for the same tag.
      - name: Create the release
        shell: bash
        # Retried, and fine as long as the release exists at the end: a hiccup
        # here once left a release page with no installer on it.
        run: |
          for i in 1 2 3; do
            gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && exit 0
            gh release create "$GITHUB_REF_NAME" --title "LUMA for Windows ${GITHUB_REF_NAME#v}" --notes "Download **LUMA-Setup.exe** below and run it. Already have LUMA 0.6.0 or newer? It updates itself." && exit 0
            sleep $((i * 5))
          done
          gh release view "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
